<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PimerAppSolar — Calculadora de Campo Solar Fotovoltaico</title>
  <meta name="description" content="Aplicación profesional para ingenieros: cálculo de variables eléctricas, térmicas y de rendimiento de campos solares fotovoltaicos. Curvas I-V, temperaturas de celda, Performance Ratio y más.">
  <meta name="keywords" content="solar, fotovoltaico, PV, calculadora, I-V curve, NOCT, performance ratio, ingeniería solar">
  <meta name="author" content="VichenSolarApp">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <!-- Open-Meteo & PVGIS Icons/Fonts if needed -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <!-- Mobile menu button -->
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menú">☰</button>
  
  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">☀️</div>
          <div>
            <h1 style="display:flex; align-items:center; gap:4px;">
              PimerAppSolar 
              <span class="tooltip-trigger" style="font-size:0.6rem; cursor:help; color:var(--text-tertiary);" title="Hecho por Vicente Vera">©</span>
            </h1>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Populated by router.js -->
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle">
          <span id="theme-icon">🌙</span>
          <span id="theme-label">Modo Oscuro</span>
        </button>
        <div class="version-text">PimerAppSolar v1.0.0</div>
        <div style="font-size: 0.55rem; color: var(--text-tertiary); text-align: center; margin-top: 8px; line-height: 1.3;">
          © Licencia de uso libre sin responsabilidades.<br>Hecho por Vicente Vera Frias (Pimer S.L.)
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-header" style="display:flex; justify-content:flex-end; align-items:center; padding:4px 16px; border-bottom:1px solid var(--border-primary); background:var(--bg-card); position:sticky; top:0; z-index:10; font-size:0.8rem;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="icon" style="color:var(--text-secondary); font-size:0.9rem;">📂</span>
          <span style="color:var(--text-secondary);">Proyecto Activo:</span>
          <div id="header-project-name" style="color:var(--solar-amber); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:250px;">Cargando...</div>
        </div>
      </header>
      <div class="tab-content" id="tab-content">
        <!-- Tab content rendered here by router -->
        <div class="loading-overlay">
          <div class="spinner"></div>
          <span>Cargando PimerAppSolar...</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Leaflet JS for maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- App entry point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
